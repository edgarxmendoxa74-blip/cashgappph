<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- GCash Logo Simplified Version -->
  <defs>
    <linearGradient id="gcashGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- G Icon Circle -->
  <circle cx="30" cy="30" r="22" fill="url(#gcashGradient)"/>
  
  <!-- G Letter -->
  <path d="M 30 15 A 15 15 0 1 0 30 45 L 30 30 L 38 30" 
        stroke="white" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Cash Text -->
  <text x="60" y="42" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="#0066cc">Cash</text>
</svg>
